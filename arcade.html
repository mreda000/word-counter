<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Find your game | ChickenTask</title>
  <meta name="description" content="ChickenTask games now have their own pages with instructions and practice tips.">
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/site.css">
  <script>
  (() => {
    // Netlify handles standard game-only links with permanent redirects.
    // This fallback also preserves the game choice when old links include
    // extra query parameters, and works on other static hosts.
    const destinations = new Map([
      ['scramble', '/word-scramble'],
      ['daily', '/daily-word'],
      ['reaction', '/reaction-time']
    ]);
    const game = new URLSearchParams(window.location.search).get('game');
    const destination = destinations.get(game) || '/games';
    window.location.replace(destination + window.location.hash);
  })();
  </script>
</head>
<body data-ads="off">
  <main class="shell page-main">
    <article class="page-card content-guide">
      <div class="eyebrow">ChickenTask games</div>
      <h1>Your games have their own pages.</h1>
      <p>If you are not redirected automatically, choose your game below. Each page includes the game, its rules, and practical instructions.</p>
      <ul>
        <li><a href="/word-scramble">Play Word Scramble</a></li>
        <li><a href="/daily-word">Play Daily Word</a></li>
        <li><a href="/reaction-time">Play Reaction Time</a></li>
      </ul>
      <p><a href="/games">Browse all games</a> · <a href="/">ChickenTask home</a></p>
    </article>
  </main>
</body>
</html>
